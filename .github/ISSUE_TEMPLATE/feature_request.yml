name: Idea
description: Something you would like MythaPrism to do
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes: { label: Your idea, description: "What would you like, and what would you use it for?" }
    validations: { required: true }
  - type: dropdown
    id: where
    attributes: { label: Where, options: [Web tool, Phone app, Website, Plug-in and Showroom for Blender, MythaBraille] }
