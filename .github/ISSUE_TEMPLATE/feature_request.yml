name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What are you trying to do?, description: "The goal, not the button" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Your idea }
  - type: dropdown
    id: where
    attributes: { label: Where, multiple: true, options: [Web tool, Android app, iOS app, Website, Exports / slicer] }
