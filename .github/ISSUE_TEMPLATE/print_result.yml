name: Share a print
description: Show us a print you made with MythaPrism
labels: [print]
body:
  - type: textarea
    id: photos
    attributes: { label: Photos, description: "A photo of the print, and the preview next to it if you can. This is public, so only share pictures you are happy to show." }
    validations: { required: true }
  - type: input
    id: setup
    attributes: { label: How you made it, placeholder: "Relief, Prime, 0.08 mm layers, Bambu Lab A1 with AMS lite" }
  - type: input
    id: filaments
    attributes: { label: Filaments, placeholder: "Bambu Lab PLA Basic Black, Jade White, Cyan" }
  - type: textarea
    id: notes
    attributes: { label: Notes, description: "Anything that surprised you, good or bad" }
