name: Share a print result
description: A photo of a real print next to its preview — the most useful thing you can send
labels: [print-result]
body:
  - type: input
    id: build
    attributes: { label: Build number }
    validations: { required: true }
  - type: input
    id: setup
    attributes: { label: Printer · nozzle · layer height, placeholder: "Bambu Lab X1C · 0.4 · 0.08 mm" }
    validations: { required: true }
  - type: input
    id: modeengine
    attributes: { label: Mode & engine, placeholder: "Relief · V1.7 auto" }
    validations: { required: true }
  - type: textarea
    id: filaments
    attributes: { label: Filaments used (brand + color) }
    validations: { required: true }
  - type: textarea
    id: photos
    attributes: { label: Photos, description: "The print (soft, even light) and the tool's preview. Your own photos only, or with the subject's consent." }
    validations: { required: true }
  - type: textarea
    id: notes
    attributes: { label: What matched, what didn't }
