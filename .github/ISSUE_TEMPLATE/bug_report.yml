name: Bug report
description: Something in the tool, app or website isn't working
labels: [bug]
body:
  - type: input
    id: build
    attributes: { label: Build number, description: "Account menu → version (e.g. 2026-10-27.609)", placeholder: "2026-10-27.609" }
    validations: { required: true }
  - type: dropdown
    id: where
    attributes: { label: Where, options: [Web tool, Android app, iOS app, Website / account, Plug-in and Showroom (Blender), MythaBraille] }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Device & browser / OS, placeholder: "Windows 11 · Chrome 130 / Pixel 8 · Android 15 / iPhone 15 · iOS 19" }
    validations: { required: true }
  - type: input
    id: modeengine
    attributes: { label: Print mode & engine, placeholder: "Relief · Prime" }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: "What you did, what you expected, what happened" }
    validations: { required: true }
  - type: textarea
    id: shots
    attributes: { label: Screenshots / files, description: "Drag screenshots here. Please do NOT attach photos of other people without their consent." }
  - type: checkboxes
    id: ok
    attributes: { label: Checks, options: [ { label: "I searched existing issues", required: true }, { label: "This report contains no account, payment or personal data", required: true } ] }
